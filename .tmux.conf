set-option -g prefix C-q

set -g exit-empty off

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_window_status_style 'rounded'
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g default-shell /usr/bin/zsh
set -g mouse on

# Open new window
unbind c
bind t new-window -c '#{pane_current_path}'

# Label panes with pane number and working directory, and border the active pane.
# pane-border-status is only turned on when the window has more than one pane.
set -g pane-border-indicators off
set -g pane-border-format "#[align=centre] #P: #{pane_current_path} "
set-hook -g window-layout-changed "if-shell -F '#{==:#{window_panes},1}' 'set -w pane-border-status off' 'set -w pane-border-status top'"

# Change/swap windows
bind -n C-pageup previous-window
bind -n C-pagedown next-window
bind -n C-S-pageup swap-window -t -1 \; previous-window
bind -n C-S-pagedown swap-window -t +1 \; next-window

# Quick scroll mode
bind C-s copy-mode \; send-keys C-s
bind C-u copy-mode \; send-keys C-u
bind C-q copy-mode

# Scroll mode motions
bind-key -T copy-mode-vi C-s send-keys ?
bind-key -T copy-mode-vi C-k send-keys -X -N 6 cursor-up
bind-key -T copy-mode-vi C-j send-keys -X -N 6 cursor-down
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Enable incremental search in copy mode
bind -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

# Use hjkl
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Use 1-based indices
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

run '~/.tmux/plugins/tpm/tpm'
