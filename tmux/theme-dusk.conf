# Dusk theme: soft pastel tones on a muted slate, with rounded pills (in the
# spirit of catppuccin/onedark). The pill edges and zoom icon need a Nerd Font.

set -g status-style "bg=#1e1f2b,fg=#6c7086"
set -g status-justify left
set -g status-left ""
set -g status-right-length 80
# Program pill switches from rose to peach while the prefix key is pressed.
set -g status-right "#{?client_prefix,#[fg=#f5c2a7],#[fg=#eba0b3]}#[bg=default]#[fg=#1e1f2b]#{?client_prefix,#[bg=#f5c2a7],#[bg=#eba0b3]}#[bold]#{pane_current_command}#[nobold,bg=default]#{?client_prefix,#[fg=#f5c2a7],#[fg=#eba0b3]}"

# Windows: the current one is a lavender pill, the others are muted text with
# the same width so the list doesn't shift.
set -g window-status-separator " "
set -g window-status-format " #[fg=#6c7086]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, 󰁌,} "
set -g window-status-current-format "#[fg=#b8a9ea,bg=default]#[fg=#1e1f2b,bg=#b8a9ea,bold]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, 󰁌,}#[fg=#b8a9ea,bg=default]"
set -g window-status-current-style "default"

set -g pane-border-lines single
set -g pane-border-style "fg=#3a3d4f"
set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=#b8a9ea#,bold],#[fg=#6c7086]} #P: #{s|^$HOME|~|:pane_current_path} "

set -g message-style "bg=#2b2d3c,fg=#f5c2a7"
set -g message-command-style "bg=#2b2d3c,fg=#a6d9c0"
set -g mode-style "bg=#33364a,bold"
