set-option -g prefix C-q

set -g exit-empty off

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Theme (one file of colours per theme in this folder), built and applied with
# theme.sh. --init applies the theme last picked with prefix T and binds that
# menu. ~/.tmux.conf is a symlink to this file, so resolve it to find this
# folder.
run '"$(dirname "$(readlink -f "#{current_file}")")/theme.sh" --init'

# The left of the status bar lists the sessions no client is attached to, while
# there are any, as a white on red block. Themes don't set status-left, and the
# block has its own background, so it looks the same in all of them. tmux works out the #{S:...} loop over the sessions itself, without
# starting a shell, so it's cheap on every redraw.
set -g status-left-length 80
set -g status-left "#{?#{S:#{?session_attached,,x}},#[fg=#ffffff#,bg=#c62828#,bold] detached:#{S:#{?session_attached,, #{session_name}}} #[default],}"

set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g default-shell /usr/bin/zsh
set -g mouse on

# Open new window
unbind c
bind t new-window -c '#{pane_current_path}'

# Label panes with pane number and working directory, and border the active pane.
# pane-border-status is only turned on when the window has more than one pane.
set -g pane-border-indicators off
# The active pane border looks like the others (whatever the theme), so only
# its label stands out and the lines and corners stay one colour.
set -g pane-active-border-style "#{pane-border-style}"
set-hook -g window-layout-changed "if-shell -F '#{==:#{window_panes},1}' 'set -w pane-border-status off' 'set -w pane-border-status top'"

# Change/swap windows
bind -n C-pageup previous-window
bind -n C-pagedown next-window
bind -n C-S-pageup swap-window -t -1 \; previous-window
bind -n C-S-pagedown swap-window -t +1 \; next-window

# Quick scroll mode
bind C-s copy-mode \; send-keys C-s
bind C-u copy-mode \; send-keys C-u
bind C-q copy-mode

# Scroll mode motions
bind-key -T copy-mode-vi C-s send-keys ?
bind-key -T copy-mode-vi C-k send-keys -X -N 6 cursor-up
bind-key -T copy-mode-vi C-j send-keys -X -N 6 cursor-down
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Enable incremental search in copy mode
bind -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

# Use hjkl
set -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Use 1-based indices
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

run '~/.tmux/plugins/tpm/tpm'
