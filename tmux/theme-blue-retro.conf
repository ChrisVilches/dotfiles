# Blue retro theme: retro DOS blue in the spirit of the Windows blue screen, Far
# Manager and Turbo C++. VGA blue with cyan text, a cyan selection bar for the
# current window, grey blocks like Turbo's menu bar, and double-line frames.

set -g status-style "bg=#0000aa,fg=#55ffff"
set -g status-justify left
set -g status-left ""
set -g status-right-length 80
# Session block switches from grey to VGA yellow while the prefix key is pressed.
set -g status-right "#[fg=#aaaaaa]#{pane_current_command} #[fg=#000000]#{?client_prefix,#[bg=#ffff55],#[bg=#aaaaaa]} #S "

# Windows: the current one is a cyan selection bar like Far's, the others are
# dimmed text with the same width so the list doesn't shift.
set -g window-status-separator ""
set -g window-status-format " #[fg=#00aaaa]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#[fg=#000000,bg=#00aaaa] #{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-style "default"

# Double-line frames, with the active pane's title highlighted like Far's panels.
set -g pane-border-lines double
set -g pane-border-style "fg=#0000aa"
set -g pane-active-border-style "fg=#55ffff"
set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=#000000#,bg=#00aaaa],#[fg=#5555ff]} #P: #{s|^$HOME|~|:pane_current_path} "

set -g message-style "bg=#aaaaaa,fg=#000000"
set -g message-command-style "bg=#0000aa,fg=#ffff55"
set -g mode-style "bg=#000080,bold"
