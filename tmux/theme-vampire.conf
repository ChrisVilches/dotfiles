# Vampire theme: gothic and restrained. Near-black and greys, with deep blood
# red used sparingly as the accent.

set -g status-style "bg=#0e0e10,fg=#6e6e73"
set -g status-justify left
set -g status-left ""
set -g status-right-length 80
# Program block is dark grey like the current window, and red while the prefix key is pressed.
set -g status-right "#[fg=#e8e8ea]#{?client_prefix,#[bg=#c0162c],#[bg=#1c1c1f]}#[bold] #{pane_current_command} "

# Windows: the current one is bright text on dark grey with a thin red bar, the
# others are dim grey text with the same width so the list doesn't shift.
set -g window-status-separator ""
set -g window-status-format " #[fg=#5c5c63]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#[fg=#c0162c,bg=#1c1c1f]▎#[fg=#e8e8ea,bold]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-style "default"

set -g pane-border-lines single
set -g pane-border-style "fg=#2a2a2e"
set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=#e0243a#,bold],#[fg=#5c5c63]} #P: #{s|^$HOME|~|:pane_current_path} "

set -g message-style "bg=#1c1c1f,fg=#e0243a"
set -g message-command-style "bg=#1c1c1f,fg=#e8e8ea"
set -g mode-style "bg=#3a0d14,bold"
