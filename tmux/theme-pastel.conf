# Pastel theme: soft, varied pastel colours with rounded pills. Each window gets
# its own colour from its window ID (@1, @2, ...), which never changes, so a
# window keeps its colour when windows are moved or renumbered. The pill edges
# and zoom icon need a Nerd Font.

# Palette lookup: window ID modulo 6 -> rose, orchid, butter, mint, sky, lavender.
set -g @pastel_color "#{?#{==:#{e|%:#{s/@//:window_id},6},0},#f4a6b8,#{?#{==:#{e|%:#{s/@//:window_id},6},1},#e3a6e8,#{?#{==:#{e|%:#{s/@//:window_id},6},2},#f2e3a0,#{?#{==:#{e|%:#{s/@//:window_id},6},3},#a8e0c0,#{?#{==:#{e|%:#{s/@//:window_id},6},4},#a6c8f0,#c5b3f0}}}}}"

set -g status-style "bg=#1e1f2b,fg=#7f849c"
set -g status-justify left
set -g status-left ""
set -g status-right-length 80
# Program pill switches from soft grey to peach while the prefix key is pressed.
set -g status-right "#{?client_prefix,#[fg=#f7c59f],#[fg=#bac2de]}#[bg=default]#[fg=#1e1f2b]#{?client_prefix,#[bg=#f7c59f],#[bg=#bac2de]}#[bold]#{pane_current_command}#[nobold,bg=default]#{?client_prefix,#[fg=#f7c59f],#[fg=#bac2de]}"

# Windows: the current one is a pill in its colour, the others are text in
# their colour with the same width so the list doesn't shift.
set -g window-status-separator " "
set -g window-status-format " #[fg=#{E:@pastel_color}]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, 󰁌,} "
set -g window-status-current-format "#[fg=#{E:@pastel_color},bg=default]#[fg=#1e1f2b,bg=#{E:@pastel_color},bold]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, 󰁌,}#[fg=#{E:@pastel_color},bg=default]"
set -g window-status-current-style "default"

# The active pane label takes the current window's colour.
set -g pane-border-lines single
set -g pane-border-style "fg=#3a3d4f"
set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=#{E:@pastel_color}#,bold],#[fg=#6c7086]} #P: #{s|^$HOME|~|:pane_current_path} "

set -g message-style "bg=#2b2d3c,fg=#f7c59f"
set -g message-command-style "bg=#2b2d3c,fg=#a8e0c0"
set -g mode-style "bg=#33364a,bold"
