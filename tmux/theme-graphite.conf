# Graphite theme: like minimal, but with dark greys on near-black and high
# contrast, so the current window stands out as an inverted light grey block.

set -g status-style "bg=#111111,fg=#707070"
set -g status-justify left
set -g status-left ""
set -g status-right-length 80
# Program block matches the current window, and turns near-white while the prefix key is pressed.
set -g status-right "#{?client_prefix,#[fg=#111111#,bg=#e6e6e6],#[fg=#111111#,bg=#747474]}#[bold] #{pane_current_command} "

# Windows: the current one is an inverted light grey block, the others are grey
# text with the same width so the list doesn't shift.
set -g window-status-separator ""
set -g window-status-format " #[fg=#707070]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#[fg=#111111,bg=#747474,bold] #{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-style "default"

set -g pane-border-lines single
set -g pane-border-style "fg=#333333"
set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=#e6e6e6#,bold],#[fg=#707070]} #P: #{s|^$HOME|~|:pane_current_path} "

set -g message-style "bg=#2a2a2a,fg=#ffffff"
set -g message-command-style "bg=#2a2a2a,fg=#ffffff"
set -g mode-style "bg=#333333,bold"
