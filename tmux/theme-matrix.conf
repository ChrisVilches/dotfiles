# Matrix theme: retro phosphor-green neon on near-black.

set -g status-style "bg=#020d04,fg=#3fa34d"
set -g status-justify left
set -g status-left ""
set -g status-right-length 80
# Session block switches from neon green to pale green while the prefix key is pressed.
set -g status-right "#[fg=#3fa34d]#{pane_current_command} #[fg=#020d04]#{?client_prefix,#[bg=#c8ffd4],#[bg=#00ff41]}#[bold] #S "

# Windows: the current one is a neon green block, the others are dimmed text
# with the same width so the list doesn't shift.
set -g window-status-separator ""
set -g window-status-format " #[fg=#2f7a3a]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#[fg=#020d04,bg=#00ff41,bold] #{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-style "default"

set -g pane-border-style "fg=#14401c"
set -g pane-active-border-style "fg=#00ff41"
set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=#00ff41#,bold],#[fg=#2f7a3a]} #P: #{s|^$HOME|~|:pane_current_path} "

set -g message-style "bg=#0a2410,fg=#00ff41"
set -g message-command-style "bg=#0a2410,fg=#c8ffd4"
set -g mode-style "bg=#0a2410,bold"
