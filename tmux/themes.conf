# Theme (one file per theme in this folder), applied with theme.sh. The theme
# picked with prefix T is remembered in a gitignored symlink.
run '#{@tmux_dir}/theme.sh'
bind T display-menu -T "Theme" \
  "minimal"    m "run '#{@tmux_dir}/theme.sh minimal'" \
  "synthwave"  s "run '#{@tmux_dir}/theme.sh synthwave'" \
  "matrix"     x "run '#{@tmux_dir}/theme.sh matrix'" \
  "dusk"       d "run '#{@tmux_dir}/theme.sh dusk'" \
  "blue-retro" b "run '#{@tmux_dir}/theme.sh blue-retro'" \
  "pastel"     p "run '#{@tmux_dir}/theme.sh pastel'" \
  "vampire"    v "run '#{@tmux_dir}/theme.sh vampire'" \
  "graphite"   g "run '#{@tmux_dir}/theme.sh graphite'" \
  "tmux"       t "run '#{@tmux_dir}/theme.sh tmux'"
