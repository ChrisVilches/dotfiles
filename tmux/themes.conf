# Theme (one file per theme in this folder). The theme picked with prefix T is
# a gitignored symlink, loaded over the default one.
set -gF @tmux_themes '#{d:current_file}'
source-file -F '#{@tmux_themes}/theme-matrix.conf'
source-file -qF '#{@tmux_themes}/current-theme.conf'
bind T display-menu -T "Theme" \
  "minimal"   m "run 'ln -sfn theme-minimal.conf #{@tmux_themes}/current-theme.conf && tmux source-file #{@tmux_themes}/current-theme.conf'" \
  "synthwave" s "run 'ln -sfn theme-synthwave.conf #{@tmux_themes}/current-theme.conf && tmux source-file #{@tmux_themes}/current-theme.conf'" \
  "matrix"    x "run 'ln -sfn theme-matrix.conf #{@tmux_themes}/current-theme.conf && tmux source-file #{@tmux_themes}/current-theme.conf'" \
  "dusk"      d "run 'ln -sfn theme-dusk.conf #{@tmux_themes}/current-theme.conf && tmux source-file #{@tmux_themes}/current-theme.conf'"
