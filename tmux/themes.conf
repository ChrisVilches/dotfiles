# Theme (one file of colours per theme in this folder), built and applied with
# theme.sh. The theme picked with prefix T is remembered as the gitignored
# config theme.sh built for it, and without one tmux keeps its own default look.
source-file -qF '#{@tmux_dir}/current-theme.conf'
# Prefix T menu, listing the theme files.
run '#{@tmux_dir}/theme.sh --menu'
