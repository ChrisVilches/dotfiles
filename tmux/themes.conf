# Theme (one file per theme in tmux/). The theme picked with prefix C-t is a
# gitignored symlink, loaded over the default one.
source-file ~/dev/dotfiles/tmux/theme-matrix.conf
source-file -q ~/dev/dotfiles/tmux/current-theme.conf
bind C-t display-menu -T "Theme" \
  "minimal"   m "run 'ln -sfn theme-minimal.conf ~/dev/dotfiles/tmux/current-theme.conf && tmux source-file ~/dev/dotfiles/tmux/current-theme.conf'" \
  "synthwave" s "run 'ln -sfn theme-synthwave.conf ~/dev/dotfiles/tmux/current-theme.conf && tmux source-file ~/dev/dotfiles/tmux/current-theme.conf'" \
  "matrix"    x "run 'ln -sfn theme-matrix.conf ~/dev/dotfiles/tmux/current-theme.conf && tmux source-file ~/dev/dotfiles/tmux/current-theme.conf'"
