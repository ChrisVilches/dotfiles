# Theme (one file per theme in this folder). The theme picked with prefix T is
# a gitignored symlink, loaded over the default one.
source-file -F '#{@tmux_dir}/theme-matrix.conf'
source-file -qF '#{@tmux_dir}/current-theme.conf'
bind T display-menu -T "Theme" \
  "minimal"   m "run 'ln -sfn theme-minimal.conf #{@tmux_dir}/current-theme.conf && tmux source-file #{@tmux_dir}/current-theme.conf'" \
  "synthwave" s "run 'ln -sfn theme-synthwave.conf #{@tmux_dir}/current-theme.conf && tmux source-file #{@tmux_dir}/current-theme.conf'" \
  "matrix"    x "run 'ln -sfn theme-matrix.conf #{@tmux_dir}/current-theme.conf && tmux source-file #{@tmux_dir}/current-theme.conf'" \
  "dusk"      d "run 'ln -sfn theme-dusk.conf #{@tmux_dir}/current-theme.conf && tmux source-file #{@tmux_dir}/current-theme.conf'" \
  "blue-retro" b "run 'ln -sfn theme-blue-retro.conf #{@tmux_dir}/current-theme.conf && tmux source-file #{@tmux_dir}/current-theme.conf'" \
  "pastel"    p "run 'ln -sfn theme-pastel.conf #{@tmux_dir}/current-theme.conf && tmux source-file #{@tmux_dir}/current-theme.conf'" \
  "vampire"   v "run 'ln -sfn theme-vampire.conf #{@tmux_dir}/current-theme.conf && tmux source-file #{@tmux_dir}/current-theme.conf'" \
  "graphite"  g "run 'ln -sfn theme-graphite.conf #{@tmux_dir}/current-theme.conf && tmux source-file #{@tmux_dir}/current-theme.conf'"
