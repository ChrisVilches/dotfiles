# Custom theme. Only the 16 ANSI colour names are used, so it follows whatever
# theme the terminal (ghostty/alacritty) is using.
set -g status-style "bg=black,fg=white"
set -g status-justify left
set -g status-left ""
set -g status-right-length 80
# Program block turns yellow while the prefix key is pressed.
set -g status-right "#[fg=black]#{?client_prefix,#[bg=yellow],#[bg=blue]}#[bold] #{pane_current_command} "

# Windows: the current one is a coloured block, the others are dimmed text
# with the same width so the list doesn't shift when switching.
set -g window-status-separator ""
set -g window-status-format " #[fg=white]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, 󰁌,} "
set -g window-status-current-format "#[fg=black,bg=blue,bold] #{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, 󰁌,} "
set -g window-status-activity-style "fg=magenta"
set -g window-status-bell-style "fg=red,bold"
set -g window-status-current-style "default"

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=black,fg=yellow"
set -g message-command-style "bg=black,fg=blue"
set -g mode-style "bg=black,bold"
set -g clock-mode-colour blue

set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=blue#,bold],#[fg=brightblack]} #P: #{s|^$HOME|~|:pane_current_path} "
set -g pane-border-lines single
