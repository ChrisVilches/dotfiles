# Synthwave theme: retro 80s neon (hot pink, cyan, purple) on deep indigo.

set -g status-style "bg=#120b2e,fg=#7d6bb8"
set -g status-justify left
set -g status-left ""
set -g status-right-length 80
# Session block switches from pink to cyan while the prefix key is pressed.
set -g status-right "#[fg=#b967ff]#{pane_current_command} #[fg=#120b2e]#{?client_prefix,#[bg=#00f0ff],#[bg=#ff2a6d]}#[bold] #S "

# Windows: the current one is a pink block, the others are dimmed text with the
# same width so the list doesn't shift.
set -g window-status-separator ""
set -g window-status-format " #[fg=#5e4b99]#{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#[fg=#120b2e,bg=#ff2a6d,bold] #{s|^$HOME|~|:pane_current_path}#{?window_zoomed_flag, [Z],} "
set -g window-status-current-style "default"

set -g pane-border-style "fg=#3d2c6e"
set -g pane-active-border-style "fg=#00f0ff"
set -g pane-border-format "#[align=centre]#{?pane_active,#[fg=#00f0ff#,bold],#[fg=#5e4b99]} #P: #{s|^$HOME|~|:pane_current_path} "

set -g message-style "bg=#241b47,fg=#ff2a6d"
set -g message-command-style "bg=#241b47,fg=#00f0ff"
set -g mode-style "bg=#241b47,bold"
